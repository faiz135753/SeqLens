[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seqlens"
version = "0.1.0"
description = "A cross-domain automated time-series experiment framework for target building, factor engineering, model comparison, and reproducible reports."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "SeqLens contributors" }
]
keywords = ["time-series", "forecasting", "factors", "lgbm", "lstm", "research", "automl"]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "tabulate>=0.9",
]

[project.optional-dependencies]
diagnostics = [
  "statsmodels>=0.14",
]
app = [
  "streamlit>=1.35",
  "plotly>=5.20",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
seqlens = "seqlens.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["seqlens"]

[tool.ruff]
line-length = 100
target-version = "py310"
